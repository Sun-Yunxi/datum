<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="reglet-logo-title reglet-logo-desc">
  <title id="reglet-logo-title">Reglet</title>
  <desc id="reglet-logo-desc">A chamfered sheet with an origin mark, three vertical rules, and a drafting curve crossing them.</desc>
  <style>
    /* 默认深墨色；深色环境下自动反白，避免在深色标签栏与深色页面中消失 */
    .reglet-ink { stroke: #1f2328; }
    .reglet-solid { fill: #1f2328; }
    @media (prefers-color-scheme: dark) {
      .reglet-ink { stroke: #e6edf3; }
      .reglet-solid { fill: #e6edf3; }
    }
  </style>
  <!-- 页面基准框：右上角折角，线宽 3，视觉外沿 6.5 -->
  <path class="reglet-ink" d="M8 8h40l8 8v40H8z" fill="none" stroke="#1f2328" stroke-width="3" stroke-linejoin="miter"/>
  <!-- 原点标记：作图区域的左上角 -->
  <rect class="reglet-solid" x="10" y="10" width="4" height="4" fill="#1f2328"/>
  <!-- 三条等距垂直线：间隙 9，整体略偏左以平衡右上折角 -->
  <path class="reglet-solid" d="M18 19h3v27h-3zM30 19h3v27h-3zM42 19h3v27h-3z" fill="#1f2328"/>
  <!-- 穿过间距规的平滑曲线：两段三次曲线在 (32 32) 处共切线 -->
  <path class="reglet-ink" d="M10.5 42C19.5 42 22 26 32 32S45 24 53.5 20" fill="none" stroke="#1f2328" stroke-width="3" stroke-linecap="round"/>
  <!-- 对齐辅助线：第三根竖排线右侧至页面内缘 -->
  <path class="reglet-ink" d="M45.5 38h8.5" fill="none" stroke="#1f2328" stroke-width="1.25" stroke-dasharray="3 3" opacity="0.55"/>
</svg>
